spring.application.name=SearchFormService
spring.mongodb.uri=mongodb://localhost:27017/sfs
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
spring.jackson.property-naming-strategy=SNAKE_CASE
notificator.url=${NOTIFICATOR_URL:http://localhost:5003}
server.port=${SERVER_PORT:8080}
spring.rabbitmq.port=5672
spring.rabbitmq.host=localhost
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.exchange=form.exchange


spring.rabbitmq.bindings[0].queue=form.all.queue
spring.rabbitmq.bindings[0].routing-key=form.*
spring.rabbitmq.bindings[0].durable=true
user.service.url=http://localhost:5002/


spring.rabbitmq.bindings[1].queue=log.queue
spring.rabbitmq.bindings[1].routing-key=log.*
spring.rabbitmq.bindings[1].durable=true

spring.rabbitmq.bindings[2].queue=form.matched.queue
spring.rabbitmq.bindings[2].routing-key=form.matched
spring.rabbitmq.bindings[2].durable=true