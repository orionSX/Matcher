spring.data.mongodb.uri=mongodb://mongodb:27017/users
server.port=${SERVER_PORT:8080}

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASS:guest}

# Разрешить все origins
spring.mvc.cors.allowed-origins=*
# Разрешить все методы
spring.mvc.cors.allowed-methods=*
# Разрешить все заголовки
spring.mvc.cors.allowed-headers=*
# Разрешить учетные данные (false для всех origins)
spring.mvc.cors.allow-credentials=false
# Время кэширования
spring.mvc.cors.max-age=3600
