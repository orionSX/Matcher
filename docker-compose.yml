version: '3.9'

services:
  # Database Services
  mongodb:
    image: mongo:8.0
    container_name: akiora-mongodb  
    ports:
      - "27017:27017"
    volumes:
      - akiora_db_data:/data/db
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: akiora-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    ports:
      - "28081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

  # Backend Services
  # chat-service:
  #   build:
  #     context: ./app/backend/Chat
