  #     - notification-service
  #     - search-form-service
  #   networks:
  #     - backend
  #   restart: unless-stopped

volumes:
  akiora_db_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  backend:
    driver: bridge
