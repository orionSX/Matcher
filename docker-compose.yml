      - SMTP_PORT=587
      - SMTP_SERVER=smtp.gmail.com
      - EMAIL_ADDRESS=akioralol@gmail.com
      - EMAIL_PASSWORD=dbmm vkex blxh qwyy
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  search-form-service:
    build:
      context: ./app/backend/SearchFormService
      dockerfile: Dockerfile
    container_name: akiora-search-form-service
    ports:
      - "5004:8080"
    environment:
      - SPRING_APPLICATION_NAME=SearchFormService
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/sfs
      - SPRING_DATA_MONGODB_FIELD_NAMING_STRATEGY=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
      - SPRING_JACKSON_PROPERTY_NAMING_STRATEGY=SNAKE_CASE
      - NOTIFICATOR_URL=http://notification-service:8080
      - SERVER_PORT=8080
    depends_on:
      mongodb:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

