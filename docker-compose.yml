version: '3.9'

services:
  # Database Services
  mongodb:
    image: mongo:8.0
    container_name: akiora-mongodb  
    ports:
      - "27017:27017"
    volumes:
      - akiora_db_data:/data/db
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: akiora-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
    ports:
      - "28081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

  # Backend Services
  # chat-service:
  #   build:
  #     context: ./app/backend/Chat
  #     dockerfile: API/Dockerfile
  #   container_name: akiora-chat-service
  #   ports:
  #     - "5000:8080"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=http://0.0.0.0:8080
  #     - ConnectionStrings__MongoDB=mongodb://mongodb:27017
  #     - MongoDB__DatabaseName=chatdb
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #   networks:
  #     - backend
  #   restart: unless-stopped

  # parser-service:
  #   build:
  #     context: ./app/backend/Parser
  #     dockerfile: API/Dockerfile
  #   container_name: akiora-parser-service
  #   ports:
  #     - "5001:8080"
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Development
  #     - ASPNETCORE_URLS=http://0.0.0.0:8080
  #   networks:
  #     - backend
  #   restart: unless-stopped

  user-service:
    build:
      context: ./app/backend/UserService
      dockerfile: Dockerfile
    container_name: akiora-user-service
    ports:
      - "5002:5002"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/users
      - SERVER_PORT=5002
    depends_on:
      - mongodb 
    networks:
      - backend
    restart: unless-stopped

  notification-service:
    build:
      context: ./app/backend/NotificationService
      dockerfile: Dockerfile
    container_name: akiora-notification-service
    ports:
      - "5003:5003"
    environment:
      - USER_SERVICE_URL=http://user-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notifierdb
      - SERVER_PORT=5003
      - SPRINGDOC_SWAGGER_UI_PATH=/swagger-ui.html
      - SPRINGDOC_API_DOCS_PATH=/v3/api-docs
      - TELEGRAM_BOT_TOKEN=7715541625:AAFkoVyrNhJj9_bb6mp8ri_k1B5TBFFAxK0
      - TELEGRAM_BOT_USERNAME=@SpeechToTextVictoria_Bot
      - SMTP_PORT=587
      - SMTP_SERVER=smtp.gmail.com
      - EMAIL_ADDRESS=akioralol@gmail.com
      - EMAIL_PASSWORD=dbmm vkex blxh qwyy
    depends_on:
      - mongodb
    networks:
      - backend
    restart: unless-stopped

  search-form-service:
    build:
      context: ./app/backend/SearchFormService
      dockerfile: Dockerfile
    container_name: akiora-search-form-service
    ports:
      - "5004:5004"
    environment:
      - APP_NAME=SearchFormService
      - MONGO_URI=mongodb://mongodb:27017/sfs
      - SPRING_DATA_MONGODB_FIELD_NAMING_STRATEGY=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
      - SPRING_JACKSON_PROPERTY_NAMING_STRATEGY=SNAKE_CASE   
      - SERVER_PORT=5004
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=guest
      - RABBIT_PASS=guest
      - RABBIT_PORT=5672
  
    depends_on:
      - mongodb
      - rabbitmq
      
    networks:
      - backend
    restart: unless-stopped


  form-consumer:
    build:
        context: ./app/backend/formconsumer
        dockerfile: Dockerfile
    container_name: akiora-form-consumer    
    environment:
      - APP_NAME=FormConsumer
      - USER_SERVICE_URL=http://user-service:5002
      - NOTIFICATION_SERVICE_URL=http://notification-service:5003
      - SPRING_JACKSON_PROPERTY_NAMING_STRATEGY=SNAKE_CASE   
      - RABBIT_PORT=5672
      - RABBIT_HOST=rabbitmq
      - RABBIT_USER=guest
      - RABBIT_PASS=guest

    depends_on:
      - rabbitmq       
      
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
  # Frontend Service
  # frontend:
