  #   networks:
  #     - backend
  #   restart: unless-stopped

  user-service:
    build:
      context: ./app/backend/UserService
      dockerfile: Dockerfile
    container_name: akiora-user-service
    ports:
      - "5002:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/users
      - SERVER_PORT=8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  notification-service:
    build:
      context: ./app/backend/NotificationService
      dockerfile: Dockerfile
    container_name: akiora-notification-service
    ports:
      - "5003:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notifierdb
      - SERVER_PORT=8080
      - SPRINGDOC_SWAGGER_UI_PATH=/swagger-ui.html
      - SPRINGDOC_API_DOCS_PATH=/v3/api-docs
